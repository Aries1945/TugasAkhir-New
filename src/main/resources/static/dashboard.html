<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ThermoStream - MQTT Live Dashboard">
    <title>Dashboard - Tugas Akhir</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- Top Navigation -->
    <nav class="glass-nav">
        <div class="logo-container">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2">
                    <img src="assets/LogoUnpar.png" alt="Unpar" class="nav-logo-img">
                    <img src="assets/LogoIF2.png" alt="IF" class="nav-logo-img">
                </div>
            </div>

            <!-- Links -->
            <div class="nav-links ml-8">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="settings.html" class="nav-link">Configure</a>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Status Badge -->
            <div class="status-badge">
                <div class="w-2 h-2 rounded-full" id="mqtt-indicator"></div>
                <span class="ws-status-text">MQTT</span>
                <span class="mqtt-status-text" id="mqtt-status">Memuat...</span>
            </div>

        </div>
    </nav>

    <main class="container">
        <section class="glass dashboard-intro">
            <div>
                <p class="dashboard-eyebrow">MONITORING MQTT</p>
                <h1>Suhu sensor</h1>
                <p id="dashboard-info" role="status">Mengambil data dari aplikasi...</p>
            </div>
            <a href="settings.html" class="configure-link">Atur koneksi &amp; topic →</a>
        </section>
        <p id="dashboard-empty" class="glass empty-state">Belum ada data suhu. Hubungkan broker, subscribe, lalu
            jalankan publisher.</p>
        <!-- Sensor Cards Grid -->
        <div id="sensor-cards-container" class="grid grid-cols-1 md-grid-cols-3 gap-6 mb-6">
            <!-- Kartu diisi dari template HTML di bawah. -->
        </div>

        <section id="sensor-detail" class="glass sensor-detail" hidden aria-live="polite">
            <div class="stream-header">
                <div class="stream-title">
                    <p class="dashboard-eyebrow">DETAIL ANALISIS</p>
                    <h2 id="detail-sensor-name">Sensor</h2>
                    <p id="detail-range">Rentang suhu pembacaan sensor.</p>
                </div>
                <button id="close-detail" class="close-detail" type="button">Tutup detail</button>
            </div>
            <div class="chart-container detail-chart-container">
                <canvas id="detailChart" role="img" aria-label="Grafik suhu sensor terpilih"></canvas>
            </div>
        </section>

    </main>

    <!-- Bentuk kartu ditulis di HTML; JavaScript hanya menyalin dan mengisinya. -->
    <template id="sensor-template">
        <article class="gradient-card sensor-select-card" tabindex="0" role="button">
            <p class="card-label">SENSOR SUHU</p>
            <div class="sensor-card-name-row">
                <h2 class="card-title"></h2>
                <span aria-hidden="true">→</span>
            </div>
            <p class="sensor-card-temperature"><span class="card-temperature-value">—</span> <span>°C</span></p>
            <p class="sensor-card-hint">Klik untuk melihat detail grafik</p>
        </article>
    </template>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <!-- App Logic -->
    <script src="js/dashboard.js"></script>
</body>

</html>
